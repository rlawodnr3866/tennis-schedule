<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테니스 대진표 생성기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 2rem; }
h3 { font-size: 15px; font-weight: 600; margin-bottom: 0.75rem; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; padding: 1.5rem; margin-bottom: 1.25rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
input[type=text], input[type=number], input[type=time], select {
  height: 38px; padding: 0 10px; border-radius: 8px;
  border: 1px solid #ddd; font-size: 14px; color: #1a1a1a; background: #fff; outline: none;
}
input[type=text]:focus, input[type=number]:focus, input[type=time]:focus, select:focus { border-color: #999; }
input[type=number] { width: 72px; }
input[type=time] { width: 115px; }
select { width: 90px; }
.players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.gender-section h4 { font-size: 13px; font-weight: 600; color: #666; margin-bottom: 0.6rem; padding-bottom: 6px; border-bottom: 1px solid #eee; }
.player-row { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
.player-row input[type=text] { flex: 1; }
.remove-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 20px; line-height: 1; padding: 0 2px; flex-shrink: 0; }
.remove-btn:hover { color: #555; }
.add-btn { font-size: 13px; color: #888; background: none; border: 1px dashed #ccc; border-radius: 8px; padding: 6px 14px; cursor: pointer; margin-top: 4px; width: 100%; }
.add-btn:hover { background: #f9f9f9; }
.gen-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 13px 32px; font-size: 15px; font-weight: 500; cursor: pointer; width: 100%; margin-top: 0.5rem; }
.gen-btn:hover { background: #333; }
.gen-btn:active { transform: scale(0.99); }
.error { font-size: 13px; color: #c0392b; margin-top: 8px; min-height: 18px; }
.result { margin-top: 1.5rem; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.25rem; }
.stat-card { background: #f9f9f9; border-radius: 8px; padding: 0.85rem 1rem; border: 1px solid #eee; }
.stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.stat-val { font-size: 22px; font-weight: 600; color: #1a1a1a; }
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
th { font-size: 12px; font-weight: 600; color: #888; text-align: left; padding: 7px 10px; border-bottom: 1px solid #eee; background: #fafafa; }
td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; color: #1a1a1a; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.badge-mx { background: #dbeafe; color: #1e40af; }
.badge-mm { background: #dcfce7; color: #166534; }
.badge-ff { background: #fce7f3; color: #9d174d; }
.mini-badge { display: inline-block; padding: 2px 7px; border-radius: 99px; font-size: 11px; font-weight: 500; margin-right: 3px; }
.mini-mm { background: #dcfce7; color: #166534; }
.mini-ff { background: #fce7f3; color: #9d174d; }
.mini-mx { background: #dbeafe; color: #1e40af; }
.gender-tag { font-size: 11px; color: #aaa; font-weight: 400; margin-left: 4px; }
.warn { font-size: 13px; color: #c0392b; margin-bottom: 1rem; background: #fff5f5; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; }
@media (max-width: 540px) { .players-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>🎾 테니스 대진표 생성기</h1>

  <div class="card">
    <h3>참가자 명단</h3>
    <div class="players-grid">
      <div class="gender-section">
        <h4>남성</h4>
        <div id="male-list"></div>
        <button class="add-btn" onclick="addPlayer('M')">+ 남성 추가</button>
      </div>
      <div class="gender-section">
        <h4>여성</h4>
        <div id="female-list"></div>
        <button class="add-btn" onclick="addPlayer('F')">+ 여성 추가</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>대회 설정</h3>
    <div class="row">
      <div><label>코트 수</label><input type="number" id="courts" value="2" min="1" max="10"></div>
      <div><label>시작 시간</label><input type="time" id="start-time" value="09:00"></div>
      <div><label>종료 시간</label><input type="time" id="end-time" value="12:00"></div>
    </div>
  </div>

  <button class="gen-btn" onclick="generate()">대진표 생성</button>
  <div class="error" id="error-msg"></div>
  <div class="result" id="result" style="display:none;"></div>
</div>

<script>
let males = [
  '김철수','이민준','박현우','정도윤','최성훈','강지호'
].map(n=>({name:n, gender:'M'}));

let females = [
  '이영희','박지연','최수정','정민지','한소희','윤지현'
].map(n=>({name:n, gender:'F'}));

function renderPlayers() {
  document.getElementById('male-list').innerHTML = males.map((p,i) => `
    <div class="player-row">
      <input type="text" value="${p.name}" placeholder="이름" oninput="males[${i}].name=this.value">
      <button class="remove-btn" onclick="removePlayer('M',${i})">×</button>
    </div>`).join('');
  document.getElementById('female-list').innerHTML = females.map((p,i) => `
    <div class="player-row">
      <input type="text" value="${p.name}" placeholder="이름" oninput="females[${i}].name=this.value">
      <button class="remove-btn" onclick="removePlayer('F',${i})">×</button>
    </div>`).join('');
}

function addPlayer(g) {
  if(g==='M') males.push({name:'', gender:'M'});
  else females.push({name:'', gender:'F'});
  renderPlayers();
}
function removePlayer(g, i) {
  if(g==='M') males.splice(i,1);
  else females.splice(i,1);
  renderPlayers();
}

function timeToMin(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// 두 플레이어가 같이 뛴 횟수 조회
function pairKey(a, b) { return [a,b].sort().join('|'); }

function generate() {
  document.getElementById('error-msg').textContent='';
  document.getElementById('result').style.display='none';

  const courts = parseInt(document.getElementById('courts').value);
  const startMin = timeToMin(document.getElementById('start-time').value);
  const endMin = timeToMin(document.getElementById('end-time').value);
  const GAME_DUR = 30;

  const vm = males.filter(p=>p.name.trim());
  const vf = females.filter(p=>p.name.trim());
  const valid = [...vm, ...vf];

  if(vm.length < 2){ document.getElementById('error-msg').textContent='남성이 최소 2명 필요해요.'; return; }
  if(vf.length < 2){ document.getElementById('error-msg').textContent='여성이 최소 2명 필요해요.'; return; }
  if(valid.length < 4){ document.getElementById('error-msg').textContent='참가자가 최소 4명 이상 필요해요.'; return; }

  const totalSlots = Math.floor((endMin - startMin) / GAME_DUR);
  if(totalSlots < 1){ document.getElementById('error-msg').textContent='시간이 너무 짧아요.'; return; }

  // 카운터 초기화
  const gameCount={}, mmCount={}, ffCount={}, mxCount={}, consec={};
  valid.forEach(p=>{ gameCount[p.name]=0; mmCount[p.name]=0; ffCount[p.name]=0; mxCount[p.name]=0; consec[p.name]=0; });

  // 파트너/상대 만남 횟수 (다양성 추적)
  const pairCount = {};
  function getPair(a,b){ const k=pairKey(a,b); return pairCount[k]||0; }
  function incPair(a,b){ const k=pairKey(a,b); pairCount[k]=(pairCount[k]||0)+1; }

  // 그룹 내 총 페어 만남 횟수 (낮을수록 다양한 조합)
  function groupDiversity(group) {
    let sum=0;
    for(let i=0;i<group.length;i++)
      for(let j=i+1;j<group.length;j++)
        sum+=getPair(group[i].name, group[j].name);
    return sum;
  }

  // 게임수 적은 사람 우선 정렬 (동점이면 다양성 우선)
  function sortByCount(arr) {
    return [...arr].sort((a,b)=>gameCount[a.name]-gameCount[b.name]);
  }

  // 남복/여복 우선 배정 비율: MM/FF를 MX보다 먼저
  // 단복 우선 = 남자는 MM, 여자는 FF를 먼저 채움
  // 혼복은 단복 보장 후 나머지 슬롯에 배정

  const schedule=[];

  for(let slot=0; slot<totalSlots; slot++){
    const slotPlaying=new Set();

    for(let court=0; court<courts; court++){
      const availM=vm.filter(p=>!slotPlaying.has(p.name)&&consec[p.name]<3);
      const availF=vf.filter(p=>!slotPlaying.has(p.name)&&consec[p.name]<3);
      const availAll=valid.filter(p=>!slotPlaying.has(p.name)&&consec[p.name]<3);
      if(availAll.length<4) break;

      const canMM=availM.length>=4;
      const canFF=availF.length>=4;
      const canMX=availM.length>=2&&availF.length>=2;
      if(!canMM&&!canFF&&!canMX) break;

      // 남복/여복 우선: 아직 남복 2게임 못 채운 남자 or 여복 2게임 못 채운 여자가 있으면 우선
      const minMMval = vm.length>0 ? Math.min(...vm.map(p=>mmCount[p.name])) : 99;
      const minFFval = vf.length>0 ? Math.min(...vf.map(p=>ffCount[p.name])) : 99;

      // 게임 타입 결정: MM/FF를 MX보다 강하게 우선
      let gameType;
      const needMM = minMMval < 2 && canMM;
      const needFF = minFFval < 2 && canFF;

      if(needMM && needFF) {
        gameType = shuffle(['MM','FF'])[0];
      } else if(needMM) {
        gameType = 'MM';
      } else if(needFF) {
        gameType = 'FF';
      } else {
        // 단복 보장 완료 후: MM/FF를 MX보다 2배 우선
        const opts=[];
        if(canMM) opts.push('MM','MM');
        if(canFF) opts.push('FF','FF');
        if(canMX) opts.push('MX');
        gameType = shuffle(opts)[0] || (canMX?'MX':canMM?'MM':'FF');
      }

      let teamA=[], teamB=[], picked=[];

      if(gameType==='MM'){
        // 게임수 적은 순 → 그 중 다양성 점수 낮은 조합 선택
        const sorted = sortByCount(availM);
        // 상위 후보 중 다양성 최적 4명 선택
        let best=null, bestScore=Infinity;
        const cands = sorted.slice(0, Math.min(sorted.length, 6));
        for(let i=0;i<cands.length;i++) for(let j=i+1;j<cands.length;j++)
          for(let k=j+1;k<cands.length;k++) for(let l=k+1;l<cands.length;l++){
            const g=[cands[i],cands[j],cands[k],cands[l]];
            const gcMin=Math.min(...g.map(p=>gameCount[p.name]));
            const gcMax=Math.max(...g.map(p=>gameCount[p.name]));
            if(gcMax-gcMin>1) continue;
            const score=groupDiversity(g);
            if(score<bestScore){bestScore=score;best=g;}
          }
        if(!best){ const s=sortByCount(availM); best=s.slice(0,4); }
        const sh=shuffle(best);
        teamA=[sh[0],sh[1]]; teamB=[sh[2],sh[3]];

      } else if(gameType==='FF'){
        const sorted=sortByCount(availF);
        let best=null, bestScore=Infinity;
        const cands=sorted.slice(0,Math.min(sorted.length,6));
        for(let i=0;i<cands.length;i++) for(let j=i+1;j<cands.length;j++)
          for(let k=j+1;k<cands.length;k++) for(let l=k+1;l<cands.length;l++){
            const g=[cands[i],cands[j],cands[k],cands[l]];
            const gcMin=Math.min(...g.map(p=>gameCount[p.name]));
            const gcMax=Math.max(...g.map(p=>gameCount[p.name]));
            if(gcMax-gcMin>1) continue;
            const score=groupDiversity(g);
            if(score<bestScore){bestScore=score;best=g;}
          }
        if(!best){ const s=sortByCount(availF); best=s.slice(0,4); }
        const sh=shuffle(best);
        teamA=[sh[0],sh[1]]; teamB=[sh[2],sh[3]];

      } else {
        // 혼복: 팀A=남1+여1, 팀B=남1+여1, 다양성 최적화
        const sortedM=sortByCount(availM);
        const sortedF=sortByCount(availF);
        const candsM=sortedM.slice(0,Math.min(sortedM.length,4));
        const candsF=sortedF.slice(0,Math.min(sortedF.length,4));
        let best=null, bestScore=Infinity;
        for(const m1 of candsM) for(const m2 of candsM) {
          if(m1===m2) continue;
          for(const f1 of candsF) for(const f2 of candsF){
            if(f1===f2) continue;
            const g=[m1,m2,f1,f2];
            const gcMin=Math.min(...g.map(p=>gameCount[p.name]));
            const gcMax=Math.max(...g.map(p=>gameCount[p.name]));
            if(gcMax-gcMin>1) continue;
            // 팀A=m1+f1, 팀B=m2+f2
            const score=getPair(m1.name,f1.name)+getPair(m2.name,f2.name)
              +getPair(m1.name,m2.name)+getPair(f1.name,f2.name);
            if(score<bestScore){bestScore=score;best={m1,m2,f1,f2};}
          }
        }
        if(!best){ best={m1:sortedM[0],m2:sortedM[1],f1:sortedF[0],f2:sortedF[1]}; }
        teamA=[best.m1, best.f1]; teamB=[best.m2, best.f2];
      }

      picked=[...teamA,...teamB];
      picked.forEach(p=>{
        slotPlaying.add(p.name);
        gameCount[p.name]++;
        if(gameType==='MM') mmCount[p.name]++;
        else if(gameType==='FF') ffCount[p.name]++;
        else mxCount[p.name]++;
      });
      // 페어 만남 기록
      for(let i=0;i<picked.length;i++)
        for(let j=i+1;j<picked.length;j++)
          incPair(picked[i].name, picked[j].name);

      schedule.push({
        time: minToTime(startMin+slot*GAME_DUR)+' ~ '+minToTime(startMin+(slot+1)*GAME_DUR),
        court: court+1, type: gameType, teamA, teamB
      });
    }

    valid.forEach(p=>{ if(slotPlaying.has(p.name)) consec[p.name]++; else consec[p.name]=0; });
  }

  const counts=Object.values(gameCount);
  const minC=Math.min(...counts), maxC=Math.max(...counts);

  const typeBadge=t=>{
    if(t==='MX') return '<span class="badge badge-mx">혼복</span>';
    if(t==='MM') return '<span class="badge badge-mm">남복</span>';
    return '<span class="badge badge-ff">여복</span>';
  };

  const scheduleRows=schedule.map(g=>`
    <tr>
      <td>${g.time}</td>
      <td style="font-weight:600">코트 ${g.court}</td>
      <td>${typeBadge(g.type)}</td>
      <td>${g.teamA.map(p=>p.name).join(' / ')}</td>
      <td>${g.teamB.map(p=>p.name).join(' / ')}</td>
    </tr>`).join('');

  const summaryRows=valid.map(p=>{
    const isMale=p.gender==='M';
    const specBadge=isMale
      ? `<span class="mini-badge mini-mm">남복 ${mmCount[p.name]}</span>`
      : `<span class="mini-badge mini-ff">여복 ${ffCount[p.name]}</span>`;
    return `<tr>
      <td>${p.name}<span class="gender-tag">${isMale?'남':'여'}</span></td>
      <td>${specBadge}</td>
      <td><span class="mini-badge mini-mx">혼복 ${mxCount[p.name]}</span></td>
      <td style="font-weight:600">${gameCount[p.name]}</td>
    </tr>`;
  }).join('');

  document.getElementById('result').style.display='block';
  document.getElementById('result').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">총 게임 수</div><div class="stat-val">${schedule.length}</div></div>
      <div class="stat-card"><div class="stat-label">참가자</div><div class="stat-val">${valid.length}명</div></div>
      <div class="stat-card"><div class="stat-label">최소 게임</div><div class="stat-val">${minC}</div></div>
      <div class="stat-card"><div class="stat-label">최대 게임</div><div class="stat-val">${maxC}</div></div>
    </div>
    ${maxC-minC>=2?'<div class="warn">⚠️ 게임 수 편차가 2 이상입니다. 참가자 수나 시간을 조정해보세요.</div>':''}
    <div class="card">
      <h3>대진표</h3>
      <table>
        <thead><tr>
          <th style="width:26%">시간</th><th style="width:13%">코트</th><th style="width:12%">종류</th>
          <th style="width:24%">팀 A</th><th style="width:25%">팀 B</th>
        </tr></thead>
        <tbody>${scheduleRows}</tbody>
      </table>
    </div>
    <div class="card">
      <h3>참가자별 게임 통계</h3>
      <table>
        <thead><tr>
          <th style="width:28%">이름</th>
          <th style="width:26%">남복 / 여복</th>
          <th style="width:26%">혼복</th>
          <th style="width:20%">합계</th>
        </tr></thead>
        <tbody>${summaryRows}</tbody>
      </table>
    </div>`;
}

renderPlayers();
</script>
</body>
</html>
