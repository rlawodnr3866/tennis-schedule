<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테니스 대진표 생성기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
.container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 2rem; color: #1a1a1a; }
h3 { font-size: 15px; font-weight: 600; margin-bottom: 0.75rem; color: #1a1a1a; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; padding: 1.5rem; margin-bottom: 1.25rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
input[type=text], input[type=number], input[type=time], select {
  height: 38px; padding: 0 10px; border-radius: 8px;
  border: 1px solid #ddd; font-size: 14px; color: #1a1a1a; background: #fff; outline: none;
}
input[type=text]:focus, input[type=number]:focus, input[type=time]:focus, select:focus { border-color: #999; }
input[type=number] { width: 72px; }
input[type=time] { width: 115px; }
select { width: 90px; }
.player-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.player-row input[type=text] { width: 130px; }
.remove-btn { background: none; border: none; cursor: pointer; color: #aaa; font-size: 20px; line-height: 1; padding: 0 4px; }
.remove-btn:hover { color: #555; }
.add-btn { font-size: 13px; color: #888; background: none; border: 1px dashed #ccc; border-radius: 8px; padding: 7px 16px; cursor: pointer; margin-top: 6px; }
.add-btn:hover { background: #f9f9f9; }
.gen-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 12px 32px; font-size: 15px; font-weight: 500; cursor: pointer; width: 100%; margin-top: 0.5rem; }
.gen-btn:hover { background: #333; }
.gen-btn:active { transform: scale(0.99); }
.error { font-size: 13px; color: #c0392b; margin-top: 8px; min-height: 18px; }
.result { margin-top: 1.5rem; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.stat-card { background: #f9f9f9; border-radius: 8px; padding: 0.85rem 1rem; border: 1px solid #eee; }
.stat-label { font-size: 12px; color: #888; margin-bottom: 4px; }
.stat-val { font-size: 22px; font-weight: 600; color: #1a1a1a; }
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
th { font-size: 12px; font-weight: 600; color: #888; text-align: left; padding: 7px 10px; border-bottom: 1px solid #eee; background: #fafafa; }
td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; color: #1a1a1a; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.badge-mx { background: #dbeafe; color: #1e40af; }
.badge-mm { background: #dcfce7; color: #166534; }
.badge-ff { background: #fce7f3; color: #9d174d; }
.mini-badge { display: inline-block; padding: 2px 7px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.mini-mm { background: #dcfce7; color: #166534; }
.mini-ff { background: #fce7f3; color: #9d174d; }
.mini-mx { background: #dbeafe; color: #1e40af; }
.gender-tag { font-size: 11px; color: #aaa; font-weight: 400; margin-left: 4px; }
.section-title { font-size: 15px; font-weight: 600; margin: 1.5rem 0 0.75rem; color: #1a1a1a; }
.warn { font-size: 13px; color: #c0392b; margin-bottom: 1rem; background: #fff5f5; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎾 테니스 대진표 생성기</h1>

  <div class="card">
    <h3>참가자 명단</h3>
    <div id="players-list"></div>
    <button class="add-btn" onclick="addPlayer()">+ 참가자 추가</button>
  </div>

  <div class="card">
    <h3>대회 설정</h3>
    <div class="row">
      <div><label>코트 수</label><input type="number" id="courts" value="2" min="1" max="10"></div>
      <div><label>시작 시간</label><input type="time" id="start-time" value="09:00"></div>
      <div><label>종료 시간</label><input type="time" id="end-time" value="12:00"></div>
    </div>
  </div>

  <button class="gen-btn" onclick="generate()">대진표 생성</button>
  <div class="error" id="error-msg"></div>
  <div class="result" id="result" style="display:none;"></div>
</div>

<script>
let players = [
  {name:'김철수', gender:'M'},{name:'이영희', gender:'F'},
  {name:'박민준', gender:'M'},{name:'최지연', gender:'F'},
  {name:'정현우', gender:'M'},{name:'강수정', gender:'F'},
];

function renderPlayers() {
  document.getElementById('players-list').innerHTML = players.map((p,i) => `
    <div class="player-row">
      <input type="text" value="${p.name}" placeholder="이름" oninput="players[${i}].name=this.value">
      <select onchange="players[${i}].gender=this.value">
        <option value="M" ${p.gender==='M'?'selected':''}>남성</option>
        <option value="F" ${p.gender==='F'?'selected':''}>여성</option>
      </select>
      <button class="remove-btn" onclick="removePlayer(${i})">×</button>
    </div>`).join('');
}

function addPlayer() { players.push({name:'', gender:'M'}); renderPlayers(); }
function removePlayer(i) { players.splice(i,1); renderPlayers(); }
function timeToMin(t) { const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function generate() {
  document.getElementById('error-msg').textContent='';
  document.getElementById('result').style.display='none';

  const courts = parseInt(document.getElementById('courts').value);
  const startMin = timeToMin(document.getElementById('start-time').value);
  const endMin = timeToMin(document.getElementById('end-time').value);
  const GAME_DUR = 30;

  const valid = players.filter(p=>p.name.trim());
  if(valid.length < 4){ document.getElementById('error-msg').textContent='참가자가 최소 4명 이상 필요해요.'; return; }
  const males = valid.filter(p=>p.gender==='M');
  const females = valid.filter(p=>p.gender==='F');
  if(males.length < 2){ document.getElementById('error-msg').textContent='남성이 최소 2명 필요해요.'; return; }
  if(females.length < 2){ document.getElementById('error-msg').textContent='여성이 최소 2명 필요해요.'; return; }
  const totalSlots = Math.floor((endMin - startMin) / GAME_DUR);
  if(totalSlots < 1){ document.getElementById('error-msg').textContent='시간이 너무 짧아요.'; return; }

  const gameCount={}, mmCount={}, ffCount={}, mxCount={}, consec={};
  valid.forEach(p=>{ gameCount[p.name]=0; mmCount[p.name]=0; ffCount[p.name]=0; mxCount[p.name]=0; consec[p.name]=0; });

  const schedule=[];

  for(let slot=0; slot<totalSlots; slot++){
    const slotPlaying=new Set();
    for(let court=0; court<courts; court++){
      const availM=males.filter(p=>!slotPlaying.has(p.name)&&consec[p.name]<3);
      const availF=females.filter(p=>!slotPlaying.has(p.name)&&consec[p.name]<3);
      const availAll=valid.filter(p=>!slotPlaying.has(p.name)&&consec[p.name]<3);
      if(availAll.length<4) break;
      const canMX=availM.length>=2&&availF.length>=2;
      const canMM=availM.length>=4;
      const canFF=availF.length>=4;
      if(!canMX&&!canMM&&!canFF) break;

      const minMB=males.reduce((a,b)=>(mmCount[a.name]+mxCount[a.name])<=(mmCount[b.name]+mxCount[b.name])?a:b);
      const minFB=females.reduce((a,b)=>(ffCount[a.name]+mxCount[a.name])<=(ffCount[b.name]+mxCount[b.name])?a:b);
      const needMM=(mmCount[minMB.name]+mxCount[minMB.name])<2&&canMM;
      const needFF=(ffCount[minFB.name]+mxCount[minFB.name])<2&&canFF;

      let gameType;
      if(needMM) gameType='MM';
      else if(needFF) gameType='FF';
      else {
        const opts=[];
        if(canMX) opts.push('MX','MX');
        if(canMM) opts.push('MM');
        if(canFF) opts.push('FF');
        gameType=shuffle(opts)[0];
      }

      let teamA=[], teamB=[];
      if(gameType==='MX'){
        availM.sort((a,b)=>gameCount[a.name]-gameCount[b.name]);
        availF.sort((a,b)=>gameCount[a.name]-gameCount[b.name]);
        teamA=[availM[0],availF[0]]; teamB=[availM[1],availF[1]];
      } else if(gameType==='MM'){
        availM.sort((a,b)=>gameCount[a.name]-gameCount[b.name]);
        teamA=[availM[0],availM[1]]; teamB=[availM[2],availM[3]];
      } else {
        availF.sort((a,b)=>gameCount[a.name]-gameCount[b.name]);
        teamA=[availF[0],availF[1]]; teamB=[availF[2],availF[3]];
      }

      [...teamA,...teamB].forEach(p=>{
        slotPlaying.add(p.name);
        gameCount[p.name]++;
        if(gameType==='MM') mmCount[p.name]++;
        else if(gameType==='FF') ffCount[p.name]++;
        else mxCount[p.name]++;
      });

      schedule.push({
        time: minToTime(startMin+slot*GAME_DUR)+' ~ '+minToTime(startMin+(slot+1)*GAME_DUR),
        court: court+1, type: gameType, teamA, teamB
      });
    }
    valid.forEach(p=>{ if(slotPlaying.has(p.name)) consec[p.name]++; else consec[p.name]=0; });
  }

  const counts=Object.values(gameCount);
  const minC=Math.min(...counts), maxC=Math.max(...counts);

  const typeBadge=t=>{
    if(t==='MX') return '<span class="badge badge-mx">혼복</span>';
    if(t==='MM') return '<span class="badge badge-mm">남복</span>';
    return '<span class="badge badge-ff">여복</span>';
  };

  const scheduleRows=schedule.map(g=>`
    <tr>
      <td>${g.time}</td>
      <td style="font-weight:600">코트 ${g.court}</td>
      <td>${typeBadge(g.type)}</td>
      <td>${g.teamA.map(p=>p.name).join(' / ')}</td>
      <td>${g.teamB.map(p=>p.name).join(' / ')}</td>
    </tr>`).join('');

  const summaryRows=valid.map(p=>{
    const isMale=p.gender==='M';
    const specBadge=isMale
      ? `<span class="mini-badge mini-mm">남복 ${mmCount[p.name]}</span>`
      : `<span class="mini-badge mini-ff">여복 ${ffCount[p.name]}</span>`;
    return `<tr>
      <td>${p.name}<span class="gender-tag">${isMale?'남':'여'}</span></td>
      <td>${specBadge}</td>
      <td><span class="mini-badge mini-mx">혼복 ${mxCount[p.name]}</span></td>
      <td style="font-weight:600">${gameCount[p.name]}</td>
    </tr>`;
  }).join('');

  document.getElementById('result').style.display='block';
  document.getElementById('result').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">총 게임 수</div><div class="stat-val">${schedule.length}</div></div>
      <div class="stat-card"><div class="stat-label">참가자</div><div class="stat-val">${valid.length}명</div></div>
      <div class="stat-card"><div class="stat-label">최소 게임</div><div class="stat-val">${minC}</div></div>
      <div class="stat-card"><div class="stat-label">최대 게임</div><div class="stat-val">${maxC}</div></div>
    </div>
    ${maxC-minC>=2?'<div class="warn">⚠️ 게임 수 편차가 2 이상입니다. 참가자 수나 시간을 조정해보세요.</div>':''}
    <div class="card">
      <h3>대진표</h3>
      <table>
        <thead><tr>
          <th style="width:26%">시간</th><th style="width:13%">코트</th><th style="width:12%">종류</th>
          <th style="width:24%">팀 A</th><th style="width:25%">팀 B</th>
        </tr></thead>
        <tbody>${scheduleRows}</tbody>
      </table>
    </div>
    <div class="card">
      <h3>참가자별 게임 통계</h3>
      <table>
        <thead><tr>
          <th style="width:28%">이름</th>
          <th style="width:26%">남복 / 여복</th>
          <th style="width:26%">혼복</th>
          <th style="width:20%">합계</th>
        </tr></thead>
        <tbody>${summaryRows}</tbody>
      </table>
    </div>`;
}

renderPlayers();
</script>
</body>
</html>
