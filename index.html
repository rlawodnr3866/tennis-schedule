<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테니스 대진표 생성기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; }
.container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }
h1 { font-size: 22px; font-weight: 600; margin-bottom: 2rem; }
h3 { font-size: 15px; font-weight: 600; margin-bottom: 0.75rem; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; padding: 1.5rem; margin-bottom: 1.25rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
input[type=text], input[type=number], input[type=time] {
  height: 38px; padding: 0 10px; border-radius: 8px;
  border: 1px solid #ddd; font-size: 14px; color: #1a1a1a; background: #fff; outline: none;
}
input[type=text]:focus, input[type=number]:focus, input[type=time]:focus { border-color: #999; }
input[type=number] { width: 72px; }
input[type=time] { width: 140px; }
.players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.gender-section h4 { font-size: 13px; font-weight: 600; color: #666; margin-bottom: 0.6rem; padding-bottom: 6px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 6px; }
.count-badge { font-size: 11px; font-weight: 600; background: #f3f4f6; color: #6b7280; border-radius: 99px; padding: 1px 7px; }
.player-row { display: flex; gap: 8px; align-items: center; margin-bottom: 7px; }
.player-row input[type=text] { flex: 1; }
.remove-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 20px; line-height: 1; padding: 0 2px; flex-shrink: 0; }
.remove-btn:hover { color: #555; }
.add-btn { font-size: 13px; color: #888; background: none; border: 1px dashed #ccc; border-radius: 8px; padding: 6px 14px; cursor: pointer; margin-top: 4px; width: 100%; }
.add-btn:hover { background: #f9f9f9; }
.gen-btn { background: #1a1a1a; color: #fff; border: none; border-radius: 8px; padding: 13px 32px; font-size: 15px; font-weight: 500; cursor: pointer; width: 100%; margin-top: 0.5rem; }
.gen-btn:hover { background: #333; }
.gen-btn:active { transform: scale(0.99); }
.error-msg { font-size: 13px; color: #c0392b; margin-top: 8px; min-height: 18px; }
.result { margin-top: 1.5rem; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.25rem; }
.stat-card { background: #fff; border-radius: 8px; padding: 0.65rem 0.75rem; border: 1px solid #e5e5e5; }
.stat-label { font-size: 11px; color: #888; margin-bottom: 3px; }
.stat-val { font-size: 18px; font-weight: 600; color: #1a1a1a; }
select.court-select { height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; color: #1a1a1a; background: #fff; outline: none; width: 72px; }
.warn { font-size: 13px; color: #c0392b; margin-bottom: 1rem; background: #fff5f5; border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; }
.slot-block { margin-bottom: 1.25rem; }
.slot-header { font-size: 13px; font-weight: 600; color: #fff; background: #374151; border-radius: 8px 8px 0 0; padding: 8px 14px; }
.courts-row { display: grid; gap: 1px; background: #e5e5e5; border-radius: 0 0 8px 8px; overflow: hidden; }
.court-cell { background: #fff; padding: 12px 14px; display: flex; align-items: center; gap: 10px; overflow: hidden; }
.court-label { font-size: 12px; font-weight: 600; color: #6b7280; min-width: 52px; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; min-width: 36px; text-align: center; }
.badge-mx { background: #dbeafe; color: #1e40af; }
.badge-mm { background: #dcfce7; color: #166534; }
.badge-ff { background: #fce7f3; color: #9d174d; }
.vs-row { display: flex; align-items: center; gap: 8px; flex: 1; }
.team { display: flex; align-items: center; gap: 4px; }
.team-name { font-size: 13px; color: #1a1a1a; white-space: nowrap; }
.vs-row { flex-wrap: nowrap; }
.team { flex-shrink: 0; }
.partner-sep { font-size: 12px; color: #aaa; }
.vs-sep { font-size: 12px; font-weight: 600; color: #d1d5db; padding: 0 4px; }
.summary-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.summary-table th { font-size: 12px; font-weight: 600; color: #888; text-align: left; padding: 7px 10px; border-bottom: 1px solid #eee; background: #fafafa; }
.summary-table td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; color: #1a1a1a; vertical-align: middle; }
.summary-table tr:last-child td { border-bottom: none; }
.mini-badge { display: inline-block; padding: 2px 7px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.mini-mm { background: #dcfce7; color: #166534; }
.mini-ff { background: #fce7f3; color: #9d174d; }
.mini-mx { background: #dbeafe; color: #1e40af; }
.gender-tag { font-size: 11px; color: #aaa; font-weight: 400; margin-left: 4px; }
.rest-badge { display:inline-block; padding:2px 7px; border-radius:99px; font-size:11px; font-weight:500; background:#f3f4f6; color:#6b7280; }
@media (max-width: 540px) { .players-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <h1>🎾 테니스 대진표 생성기</h1>
  <div class="card">
    <h3>참가자 명단</h3>
    <div class="players-grid">
      <div class="gender-section">
        <h4>남성</h4>
        <div id="male-list"></div>
        <button class="add-btn" onclick="addPlayer('M')">+ 남성 추가</button>
      </div>
      <div class="gender-section">
        <h4>여성</h4>
        <div id="female-list"></div>
        <button class="add-btn" onclick="addPlayer('F')">+ 여성 추가</button>
      </div>
    </div>
  </div>
  <div class="card">
    <h3>대진표 설정</h3>
    <div class="row">
      <div><label>코트 수</label><select id="courts" class="court-select">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select></div>
      <div><label>시작 시간</label><input type="time" id="start-time" value="09:00"></div>
      <div><label>종료 시간</label><input type="time" id="end-time" value="12:00"></div>
    </div>
  </div>
  <button class="gen-btn" onclick="generate()">대진표 생성</button>
  <div class="error-msg" id="error-msg"></div>
  <div class="result" id="result" style="display:none;"></div>
</div>

<script>
let males   = ['김슬기','김인호','김재욱','박명원','염형규','유진수','이은섭','편도원'].map(n=>({name:n,gender:'M'}));
let females = ['김다영','김란','박수현','수언','유민정','지연'].map(n=>({name:n,gender:'F'}));

function renderPlayers(){
  const mCount=males.filter(p=>p.name.trim()).length;
  const fCount=females.filter(p=>p.name.trim()).length;
  document.querySelector('#male-list').previousElementSibling.innerHTML=`남성 <span class="count-badge">${mCount}명</span>`;
  document.querySelector('#female-list').previousElementSibling.innerHTML=`여성 <span class="count-badge">${fCount}명</span>`;
  document.getElementById('male-list').innerHTML=males.map((p,i)=>`
    <div class="player-row">
      <input type="text" value="${p.name}" placeholder="이름" oninput="males[${i}].name=this.value; updateCounts()">
      <button class="remove-btn" onclick="removePlayer('M',${i})">×</button>
    </div>`).join('');
  document.getElementById('female-list').innerHTML=females.map((p,i)=>`
    <div class="player-row">
      <input type="text" value="${p.name}" placeholder="이름" oninput="females[${i}].name=this.value; updateCounts()">
      <button class="remove-btn" onclick="removePlayer('F',${i})">×</button>
    </div>`).join('');
}
function updateCounts(){
  const mCount=males.filter(p=>p.name.trim()).length;
  const fCount=females.filter(p=>p.name.trim()).length;
  const mh=document.querySelector('#male-list').previousElementSibling;
  const fh=document.querySelector('#female-list').previousElementSibling;
  if(mh) mh.innerHTML=`남성 <span class="count-badge">${mCount}명</span>`;
  if(fh) fh.innerHTML=`여성 <span class="count-badge">${fCount}명</span>`;
}
function addPlayer(g){ if(g==='M') males.push({name:'',gender:'M'}); else females.push({name:'',gender:'F'}); renderPlayers(); }
function removePlayer(g,i){ if(g==='M') males.splice(i,1); else females.splice(i,1); renderPlayers(); }
function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pairKey(a,b){ return [a,b].sort().join('|'); }

const MAX_SPEC = 4; // 남복/여복 최대 게임수
const MAX_REST_STREAK = 2; // 연속 휴식 최대 횟수 (이 이상 쉬면 다음엔 무조건 출전)

function generate(){
  document.getElementById('error-msg').textContent='';
  document.getElementById('result').style.display='none';

  const courts=parseInt(document.getElementById('courts').value);
  const startMin=timeToMin(document.getElementById('start-time').value);
  const endMin=timeToMin(document.getElementById('end-time').value);
  const GAME_DUR=30;

  const vm=males.filter(p=>p.name.trim());
  const vf=females.filter(p=>p.name.trim());
  const valid=[...vm,...vf];

  if(vm.length<2){ document.getElementById('error-msg').textContent='남성이 최소 2명 필요해요.'; return; }
  if(vf.length<2){ document.getElementById('error-msg').textContent='여성이 최소 2명 필요해요.'; return; }
  if(valid.length<4){ document.getElementById('error-msg').textContent='참가자가 최소 4명 이상 필요해요.'; return; }
  const totalSlots=Math.floor((endMin-startMin)/GAME_DUR);
  if(totalSlots<1){ document.getElementById('error-msg').textContent='시간이 너무 짧아요.'; return; }

  const gameCount={}, mmCount={}, ffCount={}, mxCount={}, restStreak={};
  valid.forEach(p=>{ gameCount[p.name]=0; mmCount[p.name]=0; ffCount[p.name]=0; mxCount[p.name]=0; restStreak[p.name]=0; });

  // 두 사람이 같은 코트(팀 or 상대)로 만난 횟수 - 파트너/상대 모두 포함해 다양성 극대화
  const pairCount={};
  function getPairCount(a,b){ return pairCount[pairKey(a,b)]||0; }
  function incPairAll(players){
    for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
      const k=pairKey(players[i].name,players[j].name);
      pairCount[k]=(pairCount[k]||0)+1;
    }
  }

  // 정렬 우선순위: 연속 휴식이 긴 사람 > 게임수 적은 사람
  function sortByPriority(arr){
    return [...arr].sort((a,b)=>{
      if(restStreak[b.name]!==restStreak[a.name]) return restStreak[b.name]-restStreak[a.name];
      return gameCount[a.name]-gameCount[b.name];
    });
  }

  // 파트너/상대 중복 최소 + 강제출전(연속휴식 초과) 우선 반영한 4인 선택
  function pickBest4(pool){
    const forced=pool.filter(p=>restStreak[p.name]>=MAX_REST_STREAK);
    let cand=sortByPriority(pool).slice(0,Math.min(pool.length,8));
    forced.forEach(f=>{ if(!cand.some(x=>x.name===f.name)) cand.push(f); });
    const totalForced=Math.min(forced.length,4);

    let best=null, bestScore=Infinity;
    for(let i=0;i<cand.length;i++) for(let j=i+1;j<cand.length;j++)
      for(let k=j+1;k<cand.length;k++) for(let l=k+1;l<cand.length;l++){
        const g=[cand[i],cand[j],cand[k],cand[l]];
        const gcMax=Math.max(...g.map(p=>gameCount[p.name]));
        const gcMin=Math.min(...g.map(p=>gameCount[p.name]));
        if(gcMax-gcMin>1) continue;
        const includedForced=g.filter(p=>restStreak[p.name]>=MAX_REST_STREAK).length;
        const missingForced=Math.max(totalForced-includedForced,0);
        const totalDup=
          getPairCount(g[0].name,g[1].name)+getPairCount(g[0].name,g[2].name)+
          getPairCount(g[0].name,g[3].name)+getPairCount(g[1].name,g[2].name)+
          getPairCount(g[1].name,g[3].name)+getPairCount(g[2].name,g[3].name);
        const score=missingForced*1000+totalDup;
        if(score<bestScore){
          bestScore=score;
          const splits=[
            [[g[0],g[1]],[g[2],g[3]]],
            [[g[0],g[2]],[g[1],g[3]]],
            [[g[0],g[3]],[g[1],g[2]]],
          ];
          let bestSplit=splits[0], bestSplitDup=Infinity;
          for(const [tA,tB] of splits){
            const dup=getPairCount(tA[0].name,tA[1].name)+getPairCount(tB[0].name,tB[1].name);
            if(dup<bestSplitDup){ bestSplitDup=dup; bestSplit=[tA,tB]; }
          }
          best={tA:bestSplit[0],tB:bestSplit[1]};
        }
      }
    if(!best){
      const s=sortByPriority(pool).slice(0,4);
      best={tA:[s[0],s[1]],tB:[s[2],s[3]]};
    }
    return best;
  }

  // 혼복: 파트너/상대 중복 최소 + 강제출전 우선
  function pickBestMX(availM, availF){
    const forcedM=availM.filter(p=>restStreak[p.name]>=MAX_REST_STREAK);
    const forcedF=availF.filter(p=>restStreak[p.name]>=MAX_REST_STREAK);
    let sm=sortByPriority(availM).slice(0,Math.min(availM.length,6));
    let sf=sortByPriority(availF).slice(0,Math.min(availF.length,6));
    forcedM.forEach(f=>{ if(!sm.some(x=>x.name===f.name)) sm.push(f); });
    forcedF.forEach(f=>{ if(!sf.some(x=>x.name===f.name)) sf.push(f); });
    const totalForced=Math.min(forcedM.length,2)+Math.min(forcedF.length,2);

    let best=null, bestScore=Infinity;
    for(let i=0;i<sm.length;i++) for(let j=i+1;j<sm.length;j++){
      const m1=sm[i], m2=sm[j];
      for(let k=0;k<sf.length;k++) for(let l=k+1;l<sf.length;l++){
        const f1=sf[k], f2=sf[l];
        const g=[m1,m2,f1,f2];
        const gcMax=Math.max(...g.map(p=>gameCount[p.name]));
        const gcMin=Math.min(...g.map(p=>gameCount[p.name]));
        if(gcMax-gcMin>1) continue;
        const includedForced=g.filter(p=>restStreak[p.name]>=MAX_REST_STREAK).length;
        const missingForced=Math.max(totalForced-includedForced,0);
        const totalDup=
          getPairCount(m1.name,m2.name)+getPairCount(f1.name,f2.name)+
          getPairCount(m1.name,f1.name)+getPairCount(m1.name,f2.name)+
          getPairCount(m2.name,f1.name)+getPairCount(m2.name,f2.name);
        const score=missingForced*1000+totalDup;
        if(score<bestScore){ bestScore=score; best={m1,m2,f1,f2}; }
      }
    }
    if(!best){
      const sm2=sortByPriority(availM), sf2=sortByPriority(availF);
      best={m1:sm2[0],m2:sm2[1],f1:sf2[0],f2:sf2[1]};
    }
    const optA=getPairCount(best.m1.name,best.f1.name)+getPairCount(best.m2.name,best.f2.name);
    const optB=getPairCount(best.m1.name,best.f2.name)+getPairCount(best.m2.name,best.f1.name);
    if(optA<=optB) return {tA:[best.m1,best.f1], tB:[best.m2,best.f2]};
    return {tA:[best.m1,best.f2], tB:[best.m2,best.f1]};
  }

  function recordGame(tA,tB,type){
    const all=[...tA,...tB];
    all.forEach(p=>{
      gameCount[p.name]++;
      if(type==='MM') mmCount[p.name]++;
      else if(type==='FF') ffCount[p.name]++;
      else mxCount[p.name]++;
    });
    incPairAll(all);
  }

  const slotGames=[];

  for(let slot=0;slot<totalSlots;slot++){
    slotGames[slot]=[];
    const slotPlaying=new Set();

    for(let court=0;court<courts;court++){
      const availM=vm.filter(p=>!slotPlaying.has(p.name));
      const availF=vf.filter(p=>!slotPlaying.has(p.name));
      const availAll=[...availM,...availF];
      if(availAll.length<4) break;

      const mmAvail=availM.filter(p=>mmCount[p.name]<MAX_SPEC);
      const ffAvail=availF.filter(p=>ffCount[p.name]<MAX_SPEC);

      const canMM=mmAvail.length>=4;
      const canFF=ffAvail.length>=4;
      const canMX=availM.length>=2&&availF.length>=2;
      if(!canMM&&!canFF&&!canMX) break;

      const minMM=vm.length>0?Math.min(...vm.map(p=>mmCount[p.name])):99;
      const minFF=vf.length>0?Math.min(...vf.map(p=>ffCount[p.name])):99;
      const needMM=minMM<2&&canMM;
      const needFF=minFF<2&&canFF;

      // 연속휴식 2회 초과자가 있으면 해당 종목을 우선 배치
      const forcedNow=availAll.filter(p=>restStreak[p.name]>=MAX_REST_STREAK);
      const forcedM=forcedNow.filter(p=>p.gender==='M').length;
      const forcedF=forcedNow.filter(p=>p.gender==='F').length;

      let gameType;
      if(needMM&&needFF) gameType=shuffle(['MM','FF'])[0];
      else if(needMM) gameType='MM';
      else if(needFF) gameType='FF';
      else if(forcedM>=4&&canMM) gameType='MM';
      else if(forcedF>=4&&canFF) gameType='FF';
      else if(forcedNow.length>0&&canMX) gameType='MX';
      else {
        const opts=[];
        if(canMM) opts.push('MM','MM');
        if(canFF) opts.push('FF','FF');
        if(canMX) opts.push('MX');
        gameType=shuffle(opts)[0]||(canMX?'MX':canMM?'MM':'FF');
      }

      let teamA, teamB;
      if(gameType==='MM'){
        const pool=mmAvail.length>=4?mmAvail:availM;
        const r=pickBest4(pool); teamA=r.tA; teamB=r.tB;
      } else if(gameType==='FF'){
        const pool=ffAvail.length>=4?ffAvail:availF;
        const r=pickBest4(pool); teamA=r.tA; teamB=r.tB;
      } else {
        const r=pickBestMX(availM,availF); teamA=r.tA; teamB=r.tB;
      }

      [...teamA,...teamB].forEach(p=>slotPlaying.add(p.name));
      recordGame(teamA,teamB,gameType);
      slotGames[slot].push({court:court+1,type:gameType,teamA,teamB});
    }

    // 이번 슬롯 출전 여부에 따라 연속 휴식 카운트 갱신
    valid.forEach(p=>{
      if(slotPlaying.has(p.name)) restStreak[p.name]=0;
      else restStreak[p.name]++;
    });
  }

  // 편차 보정: 게임수가 가장 적은 사람이 이미 만난 사람들로 추가 게임 구성
  function fixImbalance(){
    for(let pass=0;pass<50;pass++){
      const counts=valid.map(p=>gameCount[p.name]);
      if(Math.max(...counts)-Math.min(...counts)<2) break;
      const minC=Math.min(...counts);
      const under=shuffle(valid.filter(p=>gameCount[p.name]===minC))[0];
      if(!under) break;
      const metAll=valid.filter(p=>p.name!==under.name&&getPairCount(under.name,p.name)>0);
      if(metAll.length<3) break;
      const underIsMale=under.gender==='M';
      const sameMet=metAll.filter(p=>p.gender===under.gender);
      const diffMet=metAll.filter(p=>p.gender!==under.gender);
      let added=false;

      if(sameMet.length>=3){
        const specCount=underIsMale?mmCount:ffCount;
        if(specCount[under.name]<MAX_SPEC){
          const partners=shuffle(sameMet).slice(0,3);
          const splits=[
            [[under,partners[0]],[partners[1],partners[2]]],
            [[under,partners[1]],[partners[0],partners[2]]],
            [[under,partners[2]],[partners[0],partners[1]]],
          ];
          let best=splits[0], bestDup=Infinity;
          for(const [tA,tB] of splits){
            const dup=getPairCount(tA[0].name,tA[1].name)+getPairCount(tB[0].name,tB[1].name);
            if(dup<bestDup){ bestDup=dup; best=[tA,tB]; }
          }
          const newType=underIsMale?'MM':'FF';
          slotGames.push([{court:1,type:newType,teamA:best[0],teamB:best[1]}]);
          recordGame(best[0],best[1],newType);
          added=true;
        }
      }
      if(!added&&diffMet.length>=2&&sameMet.length>=1){
        const partner=shuffle(sameMet)[0];
        const opps=shuffle(diffMet).slice(0,2);
        if(opps.length>=2){
          const tA=underIsMale?[under,opps[0]]:[opps[0],under];
          const tB=underIsMale?[partner,opps[1]]:[opps[1],partner];
          slotGames.push([{court:1,type:'MX',teamA:tA,teamB:tB}]);
          recordGame(tA,tB,'MX');
          added=true;
        }
      }
      if(!added) break;
    }
  }
  fixImbalance();

  const counts=Object.values(gameCount);
  const minC=Math.min(...counts), maxC=Math.max(...counts);

  const typeBadge=t=>{
    if(t==='MX') return '<span class="badge badge-mx">혼복</span>';
    if(t==='MM') return '<span class="badge badge-mm">남복</span>';
    return '<span class="badge badge-ff">여복</span>';
  };

  let slotHTML='';
  slotGames.forEach((games,slotIdx)=>{
    if(!games||games.length===0) return;
    const sMin=startMin+slotIdx*GAME_DUR;
    const eMin=sMin+GAME_DUR;
    const timeLabel=minToTime(sMin)+' ~ '+minToTime(eMin);
    const courtsHTML=games.map(g=>`
      <div class="court-cell">
        <span class="court-label">코트 ${g.court}</span>
        ${typeBadge(g.type)}
        <div class="vs-row">
          <div class="team">
            <span class="team-name">${g.teamA[0].name}</span>
            <span class="partner-sep">/</span>
            <span class="team-name">${g.teamA[1].name}</span>
          </div>
          <span class="vs-sep">vs</span>
          <div class="team">
            <span class="team-name">${g.teamB[0].name}</span>
            <span class="partner-sep">/</span>
            <span class="team-name">${g.teamB[1].name}</span>
          </div>
        </div>
      </div>`).join('');
    slotHTML+=`
      <div class="slot-block">
        <div class="slot-header">${timeLabel}</div>
        <div class="courts-row">${courtsHTML}</div>
      </div>`;
  });

  const summaryRows=valid.map(p=>{
    const isMale=p.gender==='M';
    const specBadge=isMale
      ?`<span class="mini-badge mini-mm">남복 ${mmCount[p.name]}</span>`
      :`<span class="mini-badge mini-ff">여복 ${ffCount[p.name]}</span>`;
    return `<tr>
      <td>${p.name}<span class="gender-tag">${isMale?'남':'여'}</span></td>
      <td>${specBadge}</td>
      <td><span class="mini-badge mini-mx">혼복 ${mxCount[p.name]}</span></td>
      <td style="font-weight:600">${gameCount[p.name]}</td>
    </tr>`;
  }).join('');

  document.getElementById('result').style.display='block';
  document.getElementById('result').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">총 게임 수</div><div class="stat-val">${slotGames.reduce((s,g)=>s+(g?g.length:0),0)}</div></div>
      <div class="stat-card"><div class="stat-label">참가자</div><div class="stat-val">${valid.length}명</div></div>
      <div class="stat-card"><div class="stat-label">최소 게임</div><div class="stat-val">${minC}</div></div>
      <div class="stat-card"><div class="stat-label">최대 게임</div><div class="stat-val">${maxC}</div></div>
    </div>
    ${maxC-minC>=2?'<div class="warn">⚠️ 일부 편차가 남아있어요. 참가자 수나 시간을 조정해보세요.</div>':''}
    <div class="card">
      <h3>대진표</h3>
      ${slotHTML}
    </div>
    <div class="card">
      <h3>참가자별 게임 통계</h3>
      <table class="summary-table">
        <thead><tr>
          <th style="width:28%">이름</th>
          <th style="width:26%">남복 / 여복</th>
          <th style="width:26%">혼복</th>
          <th style="width:20%">합계</th>
        </tr></thead>
        <tbody>${summaryRows}</tbody>
      </table>
    </div>`;
}
renderPlayers();
</script>
</body>
</html>
